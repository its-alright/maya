version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: microservices-postgres
    environment:
      POSTGRES_USER: microservices
      POSTGRES_PASSWORD: microservices123
      POSTGRES_DB: microservices
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microservices"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservices-network

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: microservices-openobserve
    environment:
      ZO_ROOT_USER_EMAIL: "admin@example.com"
      ZO_ROOT_USER_PASSWORD: "admin123"
      ZO_MEMORY_CACHE_SIZE: "100"
      ZO_TELEMETRY_ENABLED: "false"
    ports:
      - "5080:5080"
      - "5081:5081"
    volumes:
      - openobserve_data:/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: microservices-gateway
    environment:
      GATEWAY_PORT: 8080
      ENVIRONMENT: development
      CORS_ORIGIN: "*"
      OTEL_ENDPOINT: http://openobserve:5080
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      AUTH_SERVICE_URL: http://auth-service:50051
      WEB_API_SERVICE_URL: http://web-api:50052
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_PERIOD_SECS: 60
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - web-api
      - openobserve
    networks:
      - microservices-network

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: microservices-auth
    environment:
      AUTH_PORT: 50051
      ENVIRONMENT: development
      DATABASE_URL: postgres://microservices:microservices123@postgres:5432/microservices
      OTEL_ENDPOINT: http://openobserve:5080
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_EXPIRATION_HOURS: 24
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      openobserve:
        condition: service_healthy
    networks:
      - microservices-network

  web-api:
    build:
      context: .
      dockerfile: services/web-api/Dockerfile
    container_name: microservices-webapi
    environment:
      WEB_API_PORT: 50052
      ENVIRONMENT: development
      DATABASE_URL: postgres://microservices:microservices123@postgres:5432/microservices
      OTEL_ENDPOINT: http://openobserve:5080
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
    ports:
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      openobserve:
        condition: service_healthy
    networks:
      - microservices-network

volumes:
  postgres_data:
    driver: local
  openobserve_data:
    driver: local

networks:
  microservices-network:
    driver: bridge