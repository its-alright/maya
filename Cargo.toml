[workspace]
members = [
    "shared",
    "services/api-gateway",
    "services/auth",
    "services/web-api"
]
resolver = "2"

[workspace.dependencies]
#common
rand = "0.8"
uuid = { version = "1.10", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22.1"
async-trait = "0.1.92"

# Core
once_cell = "1.21.4"
hex = "0.4.3"
tokio = { version = "1.39.2", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"

# Tracing & Observability - РАБОЧАЯ КОМБИНАЦИЯ
tracing = "0.1.40"
tracing-core = "0.1.32"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.18", features = ["json", "env-filter"] }


opentelemetry = { version = "0.33", features = ["metrics", "trace", "logs"] }
opentelemetry-stdout = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["logs", "trace", "metrics", "rt-tokio"] }
opentelemetry-semantic-conventions = "0.33"
opentelemetry-prometheus = "0.33"


#opentelemetry-otlp = { version = "0.17.0", features = ["tonic", "logs", "metrics"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "logs"] }
opentelemetry-appender-tracing = { version = "0.33" }
prometheus = { version = "0.13", features = ["process"] }

# HTTP & Web
axum = "0.7"
http = "1.1"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "auth", "cors", "request-id", "set-header", "limit"] }
tower_governor = "0.1"
hyper = { version = "1.4", features = ["server", "http1", "http2"] }
reqwest = { version = "0.13.4", features = ["json"] }

# gRPC
tonic = "0.14.6"
tonic-build = "0.14.6"
prost = "0.12.6"
prost-types = "0.12.6"

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }

# Auth
jsonwebtoken = "11.0.0"
argon2 = "0.5"
