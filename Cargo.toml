[workspace]
members = [
    "services/api-gateway",
    "services/auth-service",
    "services/web-api"
]
resolver = "2"

[workspace.dependencies]
# Core
tokio = { version = "1.39.2", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
dotenvy = "0.15"

# Tracing & Observability - РАБОЧАЯ КОМБИНАЦИЯ
tracing = "0.1.40"
tracing-core = "0.1.32"
tracing-opentelemetry = "0.25.0"
tracing-subscriber = { version = "0.3.18", features = ["json", "env-filter"] }


opentelemetry = { version = "0.24.0", features = ["metrics", "trace", "logs"] }
opentelemetry-otlp = { version = "0.17.0", features = ["tonic", "logs", "metrics"] }
opentelemetry-stdout = "0.5.0"
opentelemetry_sdk = { version = "0.24.1", features = ["rt-tokio"] }
opentelemetry-semantic-conventions = "0.16.0"
opentelemetry-prometheus = "0.14"
prometheus = { version = "0.13", features = ["process"] }

# HTTP & Web
axum = "0.7"
http = "1.1"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "auth", "cors", "request-id", "set-header", "limit"] }
tower_governor = "0.1"
hyper = { version = "1.4", features = ["server", "http1", "http2"] }

# gRPC
tonic = "0.12.3"
tonic-build = "0.12.3"
prost = "0.12.6"
prost-types = "0.12.6"

# Database
sqlx = { version = "0.9", features = [ "runtime-tokio", "postgres", "uuid", "chrono", "migrate" ] }

# Auth
jsonwebtoken = "9.3"
argon2 = "0.5"
rand = "0.8"

# Utils
uuid = { version = "1.10", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

base64 = "0.22.1"
