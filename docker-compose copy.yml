  web-api:
    build:
      context: .
      dockerfile: services/web-api/Dockerfile
    container_name: webapi
    environment:
      WEB_API_PORT: 50052
      ENVIRONMENT: development
      DATABASE_URL: postgres://dbhost:dbuser@postgres:5432/dbname
      OTEL_ENDPOINT: http://openobserve:5080
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
    ports:
      - "50052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      openobserve:
        condition: service_healthy
    networks:
      - microservices-network

volumes:
  maya_postgres_data:
    driver: local
  openobserve_data:
    driver: local

networks:
  microservices-network:
    driver: bridge